name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Export source without Git control files
        run: python -B -I scripts/export_worktree.py . "${RUNNER_TEMP}/plzdo-export"
      - name: Run contracts with the selected runtime
        working-directory: ${{ runner.temp }}/plzdo-export
        run: |
          python -B -I tests/contract_check.py
          python -B -I tests/smoke_check.py
          python -B -I tests/phase2_check.py
          python -B -I tests/phase3_check.py
          python -B -I tests/phase4_check.py
          python -B -I tests/phase5_check.py
          python -B -I tests/local_ops_check.py
          python -B -I tests/release_check.py
      - name: Run the local release gate
        working-directory: ${{ runner.temp }}/plzdo-export
        run: ./scripts/verify
      - name: Verify release hashes
        working-directory: ${{ runner.temp }}/plzdo-export
        run: ./scripts/release-manifest --check
